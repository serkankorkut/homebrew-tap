name: Install failed
description: brew install, pipx install or uvx did not work
labels: [install]
body:
  - type: markdown
    attributes:
      value: |
        Sorry about that. The two commands below give everything needed to fix it, usually in one reply.
  - type: dropdown
    id: method
    attributes:
      label: How did you install?
      options: [Homebrew, pipx, uvx, pip, other]
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Build logs link
      description: "Homebrew only. Run `brew gist-logs serkankorkut/tap/tokenmeter` and paste the gist link it prints."
      placeholder: https://gist.github.com/...
  - type: textarea
    id: config
    attributes:
      label: Environment
      description: "Homebrew: paste the output of `brew config`. pipx, uvx or pip: paste `python3 --version` and your OS version."
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened
      description: The command you ran and the last lines of its output.
      render: text
    validations:
      required: true