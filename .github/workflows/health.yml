name: Formula health
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Remove python.org links that collide with Homebrew Python
        if: runner.os == 'macOS'
        run: find "$(brew --prefix)/bin" -lname '*/Library/Frameworks/Python.framework/*' -print -delete || true
      - run: brew install --verbose serkankorkut/tap/tokenmeter
      - run: brew test serkankorkut/tap/tokenmeter
      - run: brew audit --strict --online serkankorkut/tap/tokenmeter
      - name: Serve the dashboard
        run: |
          tokenmeter --port 7799 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7799/api/health && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:7799/
          curl -fsS -o /dev/null http://127.0.0.1:7799/api/usage
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brew-logs-${{ matrix.os }}
          path: |
            ~/Library/Logs/Homebrew
            ~/.cache/Homebrew/Logs
          if-no-files-found: ignore